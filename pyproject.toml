[project]
name = "advent-of-code"
version = "0.1.0"
description = "Advent of Code Repo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lark>=1.2.2",
    "more-itertools>=10.6.0",
    "networkx>=3.4.2",
    "numpy>=2.2.4",
    "parse>=1.20.2",
    "pillow>=11.3.0",
    "pre-commit>=4.3.0",
    "pulp>=3.3.0",
    "pytest>=8.3.3",
    "regex>=2024.9.11",
    "ruff>=0.13.0",
    "sortedcontainers>=2.4.0",
    "tqdm>=4.68.4",
    "ty>=0.0.3",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2 weeks"

[tool.ty.src]
# exclude type checking for years not yet updated
# especially as ty is not yet stable
exclude = [
    "src/advent_of_code/puzzles/year_2018",
    "src/advent_of_code/puzzles/year_2019",
    "src/advent_of_code/puzzles/year_2020",
    "src/advent_of_code/puzzles/year_2021",
    "src/advent_of_code/puzzles/year_2022",
    "src/advent_of_code/puzzles/year_2023",
    "src/advent_of_code/puzzles/year_2024",
    "src/advent_of_code/puzzles/year_2025",
]
